# Kiểm tra mỗi nhánh / pull request trước khi merge vào main: cú pháp, backend chạy được, build thử app + chạy --smoke.
name: Kiểm tra

on:
  pull_request:
  push:
    branches-ignore: [main]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python tools/kiem_tra.py
      - name: Backend khởi động được
        run: |
          pip install -q -r backend/requirements.txt
          cd backend
          CIRCLEVAULT_DATA="$RUNNER_TEMP/cv" python -m app --no-browser --port 8686 &
          for i in $(seq 1 30); do curl -sf localhost:8686/api/status && break; sleep 1; done
          curl -sf localhost:8686/ | grep -q CircleVault
          curl -sf localhost:8686/api/music/tracks

  build-app:                         # build thử bộ cài + chạy thử --smoke trước khi merge
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python tools/dong_goi_app.py --ra desktop/res
      - name: Build
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm version "0.0.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
          npm install --no-audit --no-fund
          npx electron-builder --win --x64 --publish never
      - name: Chạy thử (--smoke)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "desktop/dist/win-unpacked/CircleVault.exe" -ArgumentList "--smoke" -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Error "Chạy thử quá 150 giây"; exit 1 }
          if ($p.ExitCode -ne 0) {
            Get-ChildItem "$env:TEMP" -Filter "circlevault-smoke-*" -Directory | ForEach-Object { Get-Content (Join-Path $_.FullName "nhat-ky.txt") -ErrorAction SilentlyContinue }
            Write-Error "Chạy thử thất bại (mã $($p.ExitCode))"; exit 1
          }
          "Chạy thử: OK"
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # hết dung lượng lưu artifact thì bỏ qua – bản build thử chỉ để tải về xem
        with:
          name: CircleVault-Setup-thu
          path: desktop/dist/CircleVault-Setup-*.exe
          retention-days: 7

  android:                           # build thử app Android (ký bằng khóa thật nếu có secret, không thì khóa debug)
    runs-on: ubuntu-latest
    # TẠM DỪNG bản APK (người dùng yêu cầu, 11/2026 – GitHub Actions báo lỗi thanh toán) – tháng sau xóa dòng `if: false` để bật lại
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          CV_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/cv.jks"; export CV_KEYSTORE="$RUNNER_TEMP/cv.jks"; fi
          gradle -p android --no-daemon assembleRelease -PvName="0.0.${GITHUB_RUN_NUMBER}" -PvCode="${GITHUB_RUN_NUMBER}"
          ls -la android/app/build/outputs/apk/release/
