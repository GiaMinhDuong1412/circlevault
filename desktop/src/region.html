<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Chọn vùng chữ · CircleVault</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;cursor:crosshair;user-select:none;background:#000;font:15px/1.4 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
#shot{position:fixed;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
#dim{position:fixed;inset:0;background:rgba(0,0,0,.45)}
#sel{position:fixed;border:3px solid #19bde8;box-shadow:0 0 0 9999px rgba(0,0,0,.45);background:transparent;display:none}
#sel.on{display:block}
.help{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#fcc419;color:#121212;border:2.5px solid #121212;box-shadow:4px 4px 0 #121212;
  border-radius:6px;padding:10px 16px;font-weight:700;pointer-events:none;text-align:center}
.help small{display:block;font-weight:500}
</style>
</head>
<body>
<img id="shot" alt="">
<div id="dim"></div>
<div id="sel"></div>
<div class="help">Kéo chuột khoanh vùng có chữ cần dịch (khung hội thoại, phụ đề…)<small>Thả chuột để xong · Esc hoặc chuột phải để hủy · Enter giữ vùng cũ</small></div>
<script src="region-ui.js"></script>
</body>
</html>
