<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Phòng thoại · CircleVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/p/css/app.css">
<link rel="stylesheet" href="/p/css/voice.css">
<script>try{const r=document.documentElement,q=new URLSearchParams(location.search);
const t=q.get('theme')||localStorage.getItem('cv-theme'),s=q.get('style')||localStorage.getItem('cv-style');
if(t)r.dataset.theme=t;if(s&&s!=='brutal')r.dataset.style=s;if(q.get('embed'))r.classList.add('embed')}catch(e){}</script>
</head>
<body class="vc">
<div class="lg" id="app" data-pane="rooms">
  <header class="lg-top">
    <span class="logo-mark" aria-hidden="true"></span>
    <div class="lg-title"><small>PHÒNG THOẠI CIRCLEVAULT</small><b id="serverName">Đang vào phòng…</b></div>
    <button class="lg-stack" type="button" id="memBtn" title="Ai đang online"><span id="stack"></span><b id="onCount"></b></button>
    <span class="sp"></span>
    <button class="btn sm yellow" type="button" id="invBtn">＋ Mời bạn</button>
  </header>
  <nav class="lg-panes" aria-label="Chuyển màn hình">
    <button type="button" data-gopane="rooms" class="on">🔊 Phòng nói</button>
    <button type="button" data-gopane="chat">💬 Trò chuyện <i class="vc-badge" id="chatBadge" hidden></i></button>
  </nav>

  <main class="lg-rooms" id="rooms">
    <section class="lg-stage" id="voiceView" hidden>
      <div class="lg-stage-h"><span class="lg-live">● ĐANG NÓI CHUYỆN</span><b id="headName"></b><span class="sp"></span>
        <span class="vc-sig" id="connSig" title="Chất lượng kết nối"><i></i><i></i><i></i></span><small class="mono" id="connName"></small></div>
      <div class="vc-tiles" id="tiles"></div>
    </section>
    <div class="lg-sec-h"><b>Phòng nói chuyện</b><small class="hint" id="roomsHint"></small></div>
    <div class="lg-cards" id="chList"></div>
  </main>

  <aside class="lg-chat" id="textView">
    <div class="lg-chtabs" id="chatTabs"></div>
    <div class="vc-log" id="log" aria-live="polite"></div>
    <form class="vc-compose" id="compose">
      <input type="text" id="msgIn" maxlength="2000" autocomplete="off" placeholder="Nhắn…" aria-label="Tin nhắn">
      <button class="btn sm green" type="submit" aria-label="Gửi">Gửi ➤</button>
    </form>
  </aside>

  <aside class="lg-people box" id="people" hidden aria-label="Ai đang online"></aside>

  <footer class="lg-hud" id="mePanel">
    <button class="lg-who" type="button" id="meWho" title="Hồ sơ của bạn"></button>
    <div class="lg-hud-b">
      <button class="lg-hb" type="button" id="micBtn" aria-label="Mic"></button>
      <button class="lg-hb" type="button" id="deafBtn" title="Tắt / bật nghe (Ctrl+Shift+D)" aria-label="Nghe"></button>
      <button class="lg-hb" type="button" id="setBtn" title="Lọc giọng & cài đặt" aria-label="Lọc giọng & cài đặt">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
    </div>
    <div class="lg-conn" id="conn" hidden>
      <div><b id="connState">Đang kết nối…</b><small id="connNs"></small></div>
      <button class="lg-hb red" type="button" id="leaveBtn" title="Rời phòng nói" aria-label="Rời phòng nói">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85a1 1 0 0 1-1.41-.02L.29 13.08a.99.99 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.41.02 11.3 11.3 0 0 0-2.66-1.85 1 1 0 0 1-.56-.9v-3.1A15.3 15.3 0 0 0 12 9z"/></svg></button>
    </div>
  </footer>
</div>

<!-- Vào phòng: tên + ảnh + khung -->
<dialog id="joinDlg" class="box vc-dlg">
  <form id="joinForm" class="vc-join" method="dialog">
    <h2>Vào phòng thoại</h2>
    <p class="hint">Nói chuyện bằng giọng nói khi chơi game, nhắn tin theo kênh. Tiếng đi thẳng giữa các máy và được mã hóa.</p>
    <div class="vc-prof" id="joinProf"></div>
    <button class="btn green" type="submit">VÀO PHÒNG</button>
  </form>
</dialog>

<!-- Cài đặt -->
<dialog id="setDlg" class="box vc-dlg vc-set">
  <div class="vc-set-head">
    <div class="vc-tabs" role="tablist">
      <button class="chip on" type="button" data-stab="voice">Giọng nói &amp; lọc giọng</button>
      <button class="chip" type="button" data-stab="prof">Hồ sơ</button>
      <button class="chip" type="button" data-stab="keys">Phím tắt</button>
    </div>
    <button class="btn sm plain" type="button" id="setClose">Xong</button>
  </div>
  <div id="setBody" class="vc-set-body"></div>
</dialog>

<!-- Thẻ người dùng: âm lượng riêng + quản trị -->
<div class="vc-pop box" id="pop" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script src="/p/js/voice.js"></script>
</body>
</html>
